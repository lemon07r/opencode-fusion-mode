name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - name: Publish if this version is not on npm yet
        # Uses npm trusted publishing when configured, otherwise the NPM_TOKEN secret.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm."
          elif [ -z "$NODE_AUTH_TOKEN" ] && npm view "$NAME" name 2>&1 | grep -q E404; then
            # Trusted publishing can't create a package, so the first release is published by hand.
            echo "::notice::$NAME is not on npm yet. Publish the first version manually, then add a trusted publisher."
          else
            npm install -g npm@latest
            npm publish --access public --provenance
          fi
