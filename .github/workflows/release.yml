name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Trusted publishing: npm authenticates this workflow with its OIDC token, so no npm secret is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: bun run validate
      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "opencode-fusion-mode@$VERSION" version >/dev/null 2>&1; then
            echo "opencode-fusion-mode@$VERSION is already on npm."
          else
            npm install -g npm@11.21.0
            npm publish --access public --provenance
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
